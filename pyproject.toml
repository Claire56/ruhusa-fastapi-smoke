[project]
name = "ruhusa-fastapi-smoke"
version = "0.1.0"
description = "External FastAPI smoke application for Ruhusa v0.7.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "ruhusa[postgres]",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.uv.sources]
ruhusa = { git = "https://github.com/Claire56/ruhusa.git", tag = "v0.7.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
